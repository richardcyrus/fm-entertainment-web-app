name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires DATABASE_URL to load, even for `prisma generate`
      # (run by postinstall). Nothing in CI connects to a database.
      DATABASE_URL: mongodb://localhost:27017/ci
    steps:
    - uses: actions/checkout@v5

    - uses: pnpm/action-setup@v4
      with:
        version: 11

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run lint
      run: pnpm lint

    # - name: Run tests
    #   run: pnpm test

    - name: Run build
      run: pnpm build
